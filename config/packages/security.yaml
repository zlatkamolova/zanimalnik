security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # anonymous visitors: /vhod for the site, /admin/login for the admin
            entry_point: App\Security\LoginEntryPoint
            form_login:
                # both login forms (admin and /vhod) post here; /vhod sends its own
                # _target_path and _failure_path, so visitors never see the admin login
                login_path: app_login
                check_path: app_login
                default_target_path: admin
                enable_csrf: true
            # only when the visitor ticks "Запомни ме" on /vhod
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
            logout:
                path: app_logout
                target: app_home
            # 5 wrong passwords per minute (per e-mail + IP) → temporarily blocked
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Only the first matching rule applies. Everything else is public.
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/(dnevnik|profil)(/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
